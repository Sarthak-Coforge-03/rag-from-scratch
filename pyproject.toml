[project]
name = "rag-from-scratch"
version = "0.1.0"
description = "Internal Q&A assistant over a set of company policy documents"
readme = "README.md"
authors = [
    { name = "Sarthak-Coforge-03", email = "sarthak.kakkar@coforge.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rag-from-scratch = "rag_from_scratch:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
