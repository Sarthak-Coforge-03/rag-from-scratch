[project]
name = "rag-from-scratch"
version = "0.1.0"
description = "Internal Q&A assistant over a set of company policy documents"
readme = "README.md"
authors = [
    { name = "Sarthak-Coforge-03", email = "sarthak.kakkar@coforge.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chonkie>=1.7.0",
    "chromadb>=1.5.9",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.1.9",
]

[tool.uv.build-backend]
module-name = "rag"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"             # short summary of failures/skips
markers = [
    "llm: calls a real LLM API (slow, needs a key)",
]

[tool.coverage.run]
source = ["rag"]            # or ["rag_from_scratch"] if you keep src/
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# fail_under = 70           # turn on once real code + tests exist
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
